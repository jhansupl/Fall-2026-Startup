<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="main.css" />
  <title>Maze Racer - Login</title>
</head>

<body>
  <header>
    <h1>Maze Racer</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="race.html">Race</a></li>
        <li><a href="scores.html">High Scores</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card-section">
      <h2>Login</h2>
      <form action="#" method="post">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" placeholder="racer123" autocomplete="username" required />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required />

        <button type="submit">Sign In</button>
      </form>
    </section>

    <section class="card-section">
      <h2>Create an account</h2>
      <form action="#" method="post">
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername" name="username" placeholder="racer123" autocomplete="username" required />

        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" name="email" placeholder="you@example.com" autocomplete="email" required />

        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" autocomplete="new-password" required />

        <label for="registerConfirm">Confirm password</label>
        <input type="password" id="registerConfirm" name="confirm" autocomplete="new-password" required />

        <button type="submit">Create Account</button>
      </form>
    </section>

    <section class="card-section">
      <h2>Welcome Back</h2>
      <p>Welcome back, <strong>mazeMaster</strong>!</p>
      <p>Best time: 0:51 &middot; Races won: 3</p>
      <button type="button">Logout</button>
    </section>
  </main>

  <footer>
    <p>Maze Racer &copy; 2026 Jonas Lee</p>
    <p><a href="https://github.com/jhansupl/Fall-2026-Startup">github.com/jhansupl/Fall-2026-Startup</a></p>
  </footer>
</body>

</html>
